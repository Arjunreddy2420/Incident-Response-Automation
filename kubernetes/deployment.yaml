apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-api
  labels:
    app: incident-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-api
  template:
    metadata:
      labels:
        app: incident-api
    spec:
      containers:
        - name: incident-api
          image: gcr.io/PROJECT_ID/incident-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: incident-api-config
            - secretRef:
                name: incident-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
