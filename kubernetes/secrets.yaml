# Template only — do NOT commit real credentials to git.
#
# Populate and apply out-of-band instead, e.g.:
#   kubectl create secret generic incident-api-secrets \
#     --from-literal=DATABASE_URL='postgresql://user:pass@<cloud-sql-private-ip>:5432/incidents' \
#     --from-literal=SLACK_WEBHOOK_URL='https://hooks.slack.com/services/...'
#
# Or manage this via a secret manager integration (e.g. External Secrets Operator
# pulling from GCP Secret Manager) rather than a plain Kubernetes Secret manifest.
apiVersion: v1
kind: Secret
metadata:
  name: incident-api-secrets
  labels:
    app: incident-api
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  SLACK_WEBHOOK_URL: "REPLACE_ME"
